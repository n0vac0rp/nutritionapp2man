name: gluguide

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-gluguide.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      next-app:
        condition: service_healthy
    mem_limit: 128m
    mem_reservation: 64m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gluguide_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gluguide}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gluguide_user} -d ${POSTGRES_DB:-gluguide}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    mem_reservation: 128m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *logging

  migrate:
    image: ghcr.io/wolext4/nutritionapp2man/next-app-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gluguide_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gluguide}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 128m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *logging

  model-service:
    image: ghcr.io/wolext4/nutritionapp2man/model-service:${IMAGE_TAG:-latest}
    build:
      context: ./model-service
    restart: unless-stopped
    environment:
      PORT: "3002"
      MODEL_PATH: /app/models/food_classifier.pth
      CLASS_NAMES_PATH: /app/models/class_names.json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    mem_reservation: 512m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *logging

  next-app:
    image: ghcr.io/wolext4/nutritionapp2man/next-app:${IMAGE_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gluguide_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-gluguide}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MODEL_SERVICE_URL: http://model-service:3002
      UPLOAD_MAX_SIZE_MB: "10"
    depends_on:
      postgres:
        condition: service_healthy
      model-service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    mem_reservation: 256m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
